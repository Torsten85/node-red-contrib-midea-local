name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Used to detect whether npm publishing is configured at all;
  # the job-level env makes the secret testable in step conditions.
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # "test" script builds the dist bundle first, so the regression
      # tests run against the artifact Node-RED actually loads.
      - name: Build & test
        run: bun run test

      # Publishing is best-effort: the release may also be published to
      # npm manually, in which case this step fails harmlessly ("cannot
      # publish over previously published version") or is skipped when
      # no NPM_TOKEN secret is configured. The GitHub release below is
      # created either way, so its links stay valid.
      - name: Publish to npm
        id: publish
        continue-on-error: true
        if: env.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: success() || steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
